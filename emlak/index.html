<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Portföyüm • Emlak Kataloğu 01</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f6fa;color:#111827}.app{max-width:1120px;margin:auto}.top{position:sticky;top:0;z-index:10;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid #e5e7eb}.bar{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:23px;font-weight:900}.brand span{color:#2563eb}.sub{font-size:12px;color:#6b7280;margin-top:3px}.add{border:0;background:#111827;color:#fff;border-radius:12px;padding:11px 14px;font-weight:800}.search{padding:0 18px 12px}.search input{width:100%;padding:13px 15px;border:1px solid #e5e7eb;border-radius:13px;background:#f8fafc;outline:none}.filters{display:flex;gap:8px;overflow:auto;padding:0 18px 14px}.chip{border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:9px 14px;white-space:nowrap;color:#4b5563}.chip.active{background:#111827;color:#fff;border-color:#111827}.content{padding:20px 18px 45px}.hero{background:linear-gradient(135deg,#0f172a,#334155);color:#fff;border-radius:23px;padding:24px;margin-bottom:22px;box-shadow:0 15px 35px #11182718}.hero h1{font-size:28px;margin:0 0 7px}.hero p{margin:0;color:#d1d5db;line-height:1.5}.count{font-weight:800;margin:18px 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px #1118270b}.photo{height:220px;position:relative;background:#ddd}.photo img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;left:12px;top:12px;background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}.body{padding:15px}.type{font-size:12px;color:#2563eb;font-weight:900;text-transform:uppercase}.title{font-size:18px;font-weight:900;line-height:1.25;margin:6px 0}.loc{font-size:13px;color:#6b7280}.price{font-size:20px;font-weight:900;margin:14px 0}.meta{display:flex;gap:7px;flex-wrap:wrap}.meta span{background:#f1f5f9;border-radius:8px;padding:7px 9px;font-size:12px;color:#475569}.show{width:100%;margin-top:13px;border:0;border-radius:11px;background:#2563eb;color:#fff;padding:12px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:#fff;width:min(760px,100%);max-height:94vh;overflow:auto;border-radius:24px 24px 0 0}.sheet>img{width:100%;height:320px;object-fit:cover}.sheetbody{padding:20px}.close{float:right;border:0;background:#f1f5f9;border-radius:50%;width:38px;height:38px}.sheet h2{font-size:26px;margin:8px 0}.bigprice{font-size:26px;font-weight:900;color:#2563eb;margin:12px 0}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.detail{background:#f8fafc;padding:12px;border-radius:12px}.detail b{display:block;color:#6b7280;font-size:12px;margin-bottom:4px}.wa{display:block;text-align:center;text-decoration:none;background:#16a34a;color:#fff;border-radius:12px;padding:14px;font-weight:900}.admin{display:none;margin-bottom:20px}.admin.open{display:block}.form{display:grid;gap:10px}.form input,.form select{padding:12px;border:1px solid #ddd;border-radius:10px}.save{padding:12px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:900}.empty{text-align:center;padding:45px;color:#6b7280}.note{font-size:12px;color:#94a3b8;margin-top:20px;text-align:center}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.photo{height:235px}.hero h1{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="bar"><div><div class="brand">Portföy<span>üm</span></div><div class="sub">Emlak Kataloğu • Demo 01</div></div><button class="add" onclick="toggleAdmin()">+ Portföy Ekle</button></div><div class="search"><input id="q" placeholder="Portföy, konum, oda veya özellik ara..." oninput="render()"></div><div class="filters" id="filters"></div></header>
<main class="content">
<section class="hero"><h1>Müşterine portföyü tek ekranda göster.</h1><p>Fotoğraf, fiyat, konum ve özellikler hazır. Bir ilana dokunup “Müşteriye Göster” dediğinde detay ekranı açılır.</p></section>
<section id="admin" class="admin"><div class="card" style="padding:18px"><h3 style="margin-top:0">Hızlı Demo Portföy Ekle</h3><div class="form"><input id="nt" placeholder="İlan başlığı"><input id="np" placeholder="Fiyat (örn. 3.950.000 TL)"><input id="nl" placeholder="Konum"><select id="ny"><option>Daire</option><option>Villa</option><option>Arsa</option><option>İşyeri</option></select><button class="save" onclick="addDemo()">Listeye Ekle</button></div></div></section>
<div class="count" id="count"></div><section class="grid" id="grid"></section><div class="note">Bu sayfadaki ilanlar yalnızca demo amaçlı rastgele oluşturulmuştur.</div>
</main></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script>
let data=[
{id:1,type:'Daire',title:'Yenişehir’de Modern 3+1 Daire',price:'4.250.000 TL',area:'165 m²',rooms:'3+1',floor:'5. Kat',age:'Sıfır Bina',heat:'Yerden Isıtma',city:'Denizli / Yenişehir',image:'https://picsum.photos/seed/denizli01/1200/800',tag:'Öne Çıkan'},
{id:2,type:'Villa',title:'Kınıklı’da Havuzlu Müstakil Villa',price:'8.750.000 TL',area:'280 m²',rooms:'5+1',floor:'Müstakil',age:'3 Yaş',heat:'Kombi',city:'Denizli / Kınıklı',image:'https://picsum.photos/seed/denizli02/1200/800',tag:'Yeni'},
{id:3,type:'Daire',title:'Pamukkale’de Yatırımlık 2+1',price:'2.850.000 TL',area:'105 m²',rooms:'2+1',floor:'3. Kat',age:'8 Yaş',heat:'Kombi',city:'Denizli / Pamukkale',image:'https://picsum.photos/seed/denizli03/1200/800',tag:'Yatırımlık'},
{id:4,type:'Arsa',title:'OSB’ye Yakın Ticari Arsa',price:'6.900.000 TL',area:'1.850 m²',rooms:'—',floor:'—',age:'—',heat:'—',city:'Denizli / Honaz',image:'https://picsum.photos/seed/denizli04/1200/800',tag:'Ticari'},
{id:5,type:'İşyeri',title:'Cadde Üzeri Kiralık Dükkan',price:'45.000 TL / Ay',area:'210 m²',rooms:'—',floor:'Zemin',age:'12 Yaş',heat:'Klima',city:'Denizli / Merkez',image:'https://picsum.photos/seed/denizli05/1200/800',tag:'Kiralık'},
{id:6,type:'Daire',title:'Bağbaşı’nda Geniş 4+1 Aile Dairesi',price:'5.600.000 TL',area:'190 m²',rooms:'4+1',floor:'7. Kat',age:'2 Yaş',heat:'Yerden Isıtma',city:'Denizli / Bağbaşı',image:'https://picsum.photos/seed/denizli06/1200/800',tag:'Aile'}
];
let cat='Tümü';
function init(){filters.innerHTML=['Tümü','Daire','Villa','Arsa','İşyeri'].map(x=>`<button class="chip ${x==='Tümü'?'active':''}" onclick="setCat('${x}',this)">${x}</button>`).join('');render()}
function setCat(x,b){cat=x;document.querySelectorAll('.chip').forEach(e=>e.classList.remove('active'));b.classList.add('active');render()}
function render(){let q=document.getElementById('q').value.toLocaleLowerCase('tr');let arr=data.filter(x=>(cat==='Tümü'||x.type===cat)&&Object.values(x).join(' ').toLocaleLowerCase('tr').includes(q));count.textContent=arr.length+' portföy';grid.innerHTML=arr.length?arr.map(x=>`<article class="card"><div class="photo"><img src="${x.image}" loading="lazy"><div class="tag">${x.tag}</div></div><div class="body"><div class="type">${x.type}</div><div class="title">${x.title}</div><div class="loc">📍 ${x.city}</div><div class="price">${x.price}</div><div class="meta"><span>${x.area}</span><span>${x.rooms}</span><span>${x.floor}</span></div><button class="show" onclick="openModal(${x.id})">Müşteriye Göster</button></div></article>`).join(''):'<div class="empty">Aramana uygun portföy bulunamadı.</div>'}
function openModal(id){let x=data.find(a=>a.id===id);sheet.innerHTML=`<img src="${x.image}"><div class="sheetbody"><button class="close" onclick="closeModal()">✕</button><div class="type">${x.type}</div><h2>${x.title}</h2><div class="bigprice">${x.price}</div><div class="loc">📍 ${x.city}</div><div class="details"><div class="detail"><b>Brüt Alan</b>${x.area}</div><div class="detail"><b>Oda</b>${x.rooms}</div><div class="detail"><b>Kat</b>${x.floor}</div><div class="detail"><b>Bina</b>${x.age}</div><div class="detail"><b>Isıtma</b>${x.heat}</div><div class="detail"><b>Durum</b>Aktif Portföy</div></div><a class="wa" target="_blank" href="https://wa.me/?text=${encodeURIComponent('Merhaba, '+x.title+' ilanı hakkında bilgi almak istiyorum.')}">WhatsApp’tan İletişime Geç</a></div>`;modal.classList.add('open')}
function closeModal(){modal.classList.remove('open')}
function toggleAdmin(){admin.classList.toggle('open');if(admin.classList.contains('open'))admin.scrollIntoView({behavior:'smooth'})}
function addDemo(){let title=nt.value.trim()||'Yeni Örnek Portföy';let price=np.value.trim()||'3.950.000 TL';let city=nl.value.trim()||'Denizli / Merkez';let type=ny.value;let id=Date.now();data.unshift({id,type,title,price,area:type==='Arsa'?'750 m²':'145 m²',rooms:type==='Arsa'||type==='İşyeri'?'—':'3+1',floor:type==='Arsa'?'—':'4. Kat',age:type==='Arsa'?'—':'5 Yaş',heat:type==='Arsa'?'—':'Kombi',city,image:'https://picsum.photos/seed/demo'+id+'/1200/800',tag:'Yeni Eklenen'});nt.value='';np.value='';nl.value='';toggleAdmin();render()}
init();
</script>
</body></html>
