<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Portföyüm • Demo 01</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f6fa;color:#111827}.app{max-width:1120px;margin:auto}.top{position:sticky;top:0;z-index:10;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid #e5e7eb}.bar{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:23px;font-weight:900}.brand span{color:#2563eb}.sub{font-size:12px;color:#6b7280;margin-top:3px}.add{border:0;background:#111827;color:#fff;border-radius:12px;padding:11px 14px;font-weight:800}.search{padding:0 18px 12px}.search input{width:100%;padding:13px 15px;border:1px solid #e5e7eb;border-radius:13px;background:#f8fafc;outline:none}.filters{display:flex;gap:8px;overflow:auto;padding:0 18px 14px}.chip{border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:9px 14px;white-space:nowrap;color:#4b5563}.chip.active{background:#111827;color:#fff;border-color:#111827}.content{padding:20px 18px 45px}.hero{background:linear-gradient(135deg,#0f172a,#334155);color:#fff;border-radius:23px;padding:24px;margin-bottom:22px;box-shadow:0 15px 35px #11182718}.hero h1{font-size:28px;margin:0 0 7px}.hero p{margin:0;color:#d1d5db;line-height:1.5}.count{font-weight:800;margin:18px 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px #1118270b}.photo{height:220px;position:relative;background:#ddd}.photo img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;left:12px;top:12px;background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}.body{padding:15px}.type{font-size:12px;color:#2563eb;font-weight:900;text-transform:uppercase}.title{font-size:18px;font-weight:900;line-height:1.25;margin:6px 0}.loc{font-size:13px;color:#6b7280}.price{font-size:20px;font-weight:900;margin:14px 0}.meta{display:flex;gap:7px;flex-wrap:wrap}.meta span{background:#f1f5f9;border-radius:8px;padding:7px 9px;font-size:12px;color:#475569}.show{width:100%;margin-top:13px;border:0;border-radius:11px;background:#2563eb;color:#fff;padding:12px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:#fff;width:min(760px,100%);max-height:94vh;overflow:auto;border-radius:24px 24px 0 0}.sheet>img{width:100%;height:320px;object-fit:cover}.sheetbody{padding:20px}.close{float:right;border:0;background:#f1f5f9;border-radius:50%;width:38px;height:38px}.sheet h2{font-size:26px;margin:8px 0}.bigprice{font-size:26px;font-weight:900;color:#2563eb;margin:12px 0}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.detail{background:#f8fafc;padding:12px;border-radius:12px}.detail b{display:block;color:#6b7280;font-size:12px;margin-bottom:4px}.wa{display:block;text-align:center;text-decoration:none;background:#16a34a;color:#fff;border-radius:12px;padding:14px;font-weight:900}.admin{display:none;margin-bottom:20px}.admin.open{display:block}.form{display:grid;gap:10px}.form input,.form select{padding:12px;border:1px solid #ddd;border-radius:10px}.save{padding:12px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:900}.empty{text-align:center;padding:45px;color:#6b7280}.note{font-size:12px;color:#94a3b8;margin-top:20px;text-align:center}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.photo{height:235px}.hero h1{font-size:23px}}
</style></head><body><div class="app"><header class="top"><div class="bar"><div><div class="brand">Portföy<span>üm</span></div><div class="sub">Emlak Kataloğu • Demo 01</div></div><button class="add" onclick="toggleAdmin()">+ Portföy Ekle</button></div><div class="search"><input id="q" placeholder="Portföy, konum, oda veya özellik ara..." oninput="render()"></div><div class="filters" id="filters"></div></header><main class="content"><section class="hero"><h1>Müşterine portföyü tek ekranda göster.</h1><p>Fotoğraf, fiyat, konum ve özellikler hazır. Bir ilana dokunup “Müşteriye Göster” dediğinde detay ekranı açılır.</p></section><section id="admin" class="admin"><div class="card" style="padding:18px"><h3 style="margin-top:0">Hızlı Demo Portföy Ekle</h3><div class="form"><input id="nt" placeholder="İlan başlığı"><input id="np" placeholder="Fiyat (örn. 3.950.000 TL)"><input id="nl" placeholder="Konum"><select id="ny"><option>Daire</option><option>Villa</option><option>Arsa</option><option>İşyeri</option></select><button class="save" onclick="addDemo()">Listeye Ekle</button></div></div></section><div class="count" id="count"></div><section class="grid" id="grid"></section><div class="note">Bu sayfadaki ilanlar yalnızca demo amaçlı rastgele oluşturulmuştur.</div></main></div><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div><script>
const pics=['https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80','https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1200&q=80','https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=1200&q=80','https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=80','https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=80','https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=1200&q=80'];
let data=[['Daire','Yenişehir’de Modern 3+1 Daire','4.250.000 TL','165 m²','3+1','5. Kat','Sıfır Bina','Yerden Isıtma','Denizli / Yenişehir','Öne Çıkan'],['Villa','Kınıklı’da Havuzlu Müstakil Villa','8.750.000 TL','280 m²','5+1','Müstakil','3 Yaş','Kombi','Denizli / Kınıklı','Yeni'],['Daire','Pamukkale’de Yatırımlık 2+1','2.850.000 TL','105 m²','2+1','3. Kat','8 Yaş','Kombi','Denizli / Pamukkale','Yatırımlık'],['Arsa','OSB’ye Yakın Ticari Arsa','6.900.000 TL','1.850 m²','—','—','—','—','Denizli / Honaz','Ticari'],['İşyeri','Cadde Üzeri Kiralık Dükkan','45.000 TL / Ay','210 m²','—','Zemin','12 Yaş','Klima','Denizli / Merkez','Kiralık'],['Daire','Bağbaşı’nda Geniş 4+1 Aile Dairesi','5.600.000 TL','190 m²','4+1','7. Kat','2 Yaş','Yerden Isıtma','Denizli / Bağbaşı','Aile']];let cat='Tümü';
function init(){filters.innerHTML=['Tümü','Daire','Villa','Arsa','İşyeri'].map(x=>`<button class="chip ${x==='Tümü'?'active':''}" onclick="setCat('${x}',this)">${x}</button>`).join('');render()}function setCat(x,b){cat=x;document.querySelectorAll('.chip').forEach(e=>e.classList.remove('active'));b.classList.add('active');render()}function render(){let q=document.getElementById('q').value.toLocaleLowerCase('tr');let arr=data.filter(x=>(cat==='Tümü'||x[0]===cat)&&x.join(' ').toLocaleLowerCase('tr').includes(q));count.textContent=arr.length+' portföy';grid.innerHTML=arr.length?arr.map((x,i)=>{let idx=data.indexOf(x);return `<article class="card"><div class="photo"><img src="${pics[idx%pics.length]}" loading="lazy"><div class="tag">${x[9]}</div></div><div class="body"><div class="type">${x[0]}</div><div class="title">${x[1]}</div><div class="loc">📍 ${x[8]}</div><div class="price">${x[2]}</div><div class="meta"><span>${x[3]}</span><span>${x[4]}</span><span>${x[5]}</span></div><button class="show" onclick="openModal(${idx})">Müşteriye Göster</button></div></article>`}).join(''):'<div class="empty">Aramana uygun portföy bulunamadı.</div>'}function openModal(i){let x=data[i];sheet.innerHTML=`<img src="${pics[i%pics.length]}"><div class="sheetbody"><button class="close" onclick="closeModal()">✕</button><div class="type">${x[0]}</div><h2>${x[1]}</h2><div class="bigprice">${x[2]}</div><div class="loc">📍 ${x[8]}</div><div class="details"><div class="detail"><b>Brüt Alan</b>${x[3]}</div><div class="detail"><b>Oda</b>${x[4]}</div><div class="detail"><b>Kat</b>${x[5]}</div><div class="detail"><b>Bina</b>${x[6]}</div><div class="detail"><b>Isıtma</b>${x[7]}</div><div class="detail"><b>Durum</b>Aktif Portföy</div></div><a class="wa" target="_blank" href="https://wa.me/?text=${encodeURIComponent('Merhaba, '+x[1]+' ilanı hakkında bilgi almak istiyorum.')}">WhatsApp’tan İletişime Geç</a></div>`;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function toggleAdmin(){admin.classList.toggle('open');if(admin.classList.contains('open'))admin.scrollIntoView({behavior:'smooth'})}function addDemo(){let title=nt.value.trim()||'Yeni Örnek Portföy';let price=np.value.trim()||'3.950.000 TL';let city=nl.value.trim()||'Denizli / Merkez';let type=ny.value;data.unshift([type,title,price,type==='Arsa'?'750 m²':'145 m²',type==='Arsa'||type==='İşyeri'?'—':'3+1',type==='Arsa'?'—':'4. Kat',type==='Arsa'?'—':'5 Yaş',type==='Arsa'?'—':'Kombi',city,'Yeni Eklenen']);nt.value='';np.value='';nl.value='';toggleAdmin();render()}init();</script></body></html>
