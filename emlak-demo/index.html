<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portföyüm Demo 01</title><style>body{margin:0;font-family:Arial;background:#f5f7fb;color:#111827}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{background:#111827;color:#fff;padding:28px;border-radius:20px;margin-bottom:20px}.hero h1{margin:0 0 8px}.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:10px 0 16px;box-sizing:border-box}.chips{display:flex;gap:8px;overflow:auto}.chip{padding:9px 14px;border:1px solid #ddd;background:white;border-radius:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #0001}.card img{width:100%;height:210px;object-fit:cover}.body{padding:15px}.type{color:#2563eb;font-size:12px;font-weight:bold}.title{font-size:18px;font-weight:bold;margin:7px 0}.price{font-size:20px;font-weight:bold;margin:12px 0}.meta span{display:inline-block;background:#f1f5f9;padding:7px;border-radius:8px;margin:2px;font-size:12px}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:bold;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}} </style></head><body><div class="wrap"><div class="hero"><h1>Portföyüm</h1><div>Müşterine emlak portföylerini tek ekranda göster.</div></div><input class="search" id="search" placeholder="Portföy veya konum ara..." oninput="render()"><div class="chips"><button class="chip" onclick="filter='Tümü';render()">Tümü</button><button class="chip" onclick="filter='Daire';render()">Daire</button><button class="chip" onclick="filter='Villa';render()">Villa</button><button class="chip" onclick="filter='Arsa';render()">Arsa</button></div><h3 id="count"></h3><div class="grid" id="grid"></div></div><script>let filter='Tümü';const data=[['Daire','Yenişehir Modern 3+1','4.250.000 TL','165 m²','3+1','Denizli / Yenişehir','https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1000&q=80'],['Villa','Kınıklı Havuzlu Müstakil Villa','8.750.000 TL','280 m²','5+1','Denizli / Kınıklı','https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1000&q=80'],['Daire','Pamukkale Yatırımlık 2+1','2.850.000 TL','105 m²','2+1','Denizli / Pamukkale','https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=1000&q=80'],['Arsa','OSB Yakını Ticari Arsa','6.900.000 TL','1.850 m²','Ticari','Denizli / Honaz','https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1000&q=80'],['Daire','Bağbaşı Geniş 4+1','5.600.000 TL','190 m²','4+1','Denizli / Bağbaşı','https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=1000&q=80'],['Villa','Çamlık Premium Villa','11.250.000 TL','340 m²','6+1','Denizli / Çamlık','https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?auto=format&fit=crop&w=1000&q=80']];function render(){let q=document.getElementById('search').value.toLocaleLowerCase('tr');let a=data.filter(x=>(filter==='Tümü'||x[0]===filter)&&x.join(' ').toLocaleLowerCase('tr').includes(q));document.getElementById('count').textContent=a.length+' portföy';document.getElementById('grid').innerHTML=a.map(x=>`<div class="card"><img src="${x[6]}"><div class="body"><div class="type">${x[0]}</div><div class="title">${x[1]}</div><div>📍 ${x[5]}</div><div class="price">${x[2]}</div><div class="meta"><span>${x[3]}</span><span>${x[4]}</span></div><button class="btn" onclick="alert('${x[1]}\n${x[2]}\n${x[3]}\n${x[5]}')">Müşteriye Göster</button></div></div>`).join('')}render();</script></body></html>
