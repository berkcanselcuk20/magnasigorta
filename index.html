<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portföyüm | Emlak Demo 01</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#111827}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{background:#111827;color:white;padding:28px;border-radius:22px;margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:30px}.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;box-sizing:border-box;margin-bottom:12px}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.filters button{padding:10px 15px;border:1px solid #ddd;border-radius:22px;background:#fff;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #0001}.card img{width:100%;height:220px;object-fit:cover}.body{padding:16px}.tag{font-size:12px;font-weight:800;color:#2563eb}.title{font-size:19px;font-weight:900;margin:6px 0}.price{font-size:21px;font-weight:900;margin:12px 0}.meta span{display:inline-block;background:#f1f5f9;padding:7px 9px;border-radius:8px;margin:2px;font-size:12px}.btn{width:100%;margin-top:13px;padding:13px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-weight:800}.count{margin:16px 0;font-weight:800}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}}</style></head><body><div class="wrap"><section class="hero"><h1>🏠 Portföyüm</h1><div>Müşterilerine portföylerini hızlı ve şık şekilde göster.</div></section><input id="q" class="search" placeholder="İlan veya konum ara..."><div class="filters"><button data-cat="Tümü">Tümü</button><button data-cat="Daire">Daire</button><button data-cat="Villa">Villa</button><button data-cat="Arsa">Arsa</button><button data-cat="İşyeri">İşyeri</button></div><div id="count" class="count"></div><div id="grid" class="grid"></div></div><script>const items=[{t:'Daire',n:'Yenişehir Modern 3+1',p:'4.250.000 TL',m:'165 m²',o:'3+1',l:'Denizli / Yenişehir',i:'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1000&q=80'},{t:'Villa',n:'Kınıklı Havuzlu Villa',p:'8.750.000 TL',m:'280 m²',o:'5+1',l:'Denizli / Kınıklı',i:'https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1000&q=80'},{t:'Daire',n:'Pamukkale Merkezi 2+1',p:'2.850.000 TL',m:'105 m²',o:'2+1',l:'Denizli / Pamukkale',i:'https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=1000&q=80'},{t:'Arsa',n:'Honaz Ticari Arsa',p:'6.900.000 TL',m:'1.850 m²',o:'Ticari',l:'Denizli / Honaz',i:'https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1000&q=80'},{t:'İşyeri',n:'Merkez Cadde Üzeri Dükkan',p:'45.000 TL / Ay',m:'210 m²',o:'Dükkan',l:'Denizli / Merkez',i:'https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1000&q=80'},{t:'Villa',n:'Çamlık Premium Villa',p:'11.250.000 TL',m:'340 m²',o:'6+1',l:'Denizli / Çamlık',i:'https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?auto=format&fit=crop&w=1000&q=80'}];let cat='Tümü';const q=document.getElementById('q'),grid=document.getElementById('grid'),count=document.getElementById('count');function render(){const s=q.value.toLocaleLowerCase('tr');const a=items.filter(x=>(cat==='Tümü'||x.t===cat)&&(x.n+' '+x.l+' '+x.t).toLocaleLowerCase('tr').includes(s));count.textContent=a.length+' portföy';grid.innerHTML=a.map(x=>`<article class="card"><img src="${x.i}" alt="${x.n}"><div class="body"><div class="tag">${x.t}</div><div class="title">${x.n}</div><div>📍 ${x.l}</div><div class="price">${x.p}</div><div class="meta"><span>${x.m}</span><span>${x.o}</span></div><button class="btn" onclick='show(${JSON.stringify(x)})'>Müşteriye Göster</button></div></article>`).join('')}function show(x){alert('🏠 '+x.n+'\n\n💰 '+x.p+'\n📐 '+x.m+'\n🛏️ '+x.o+'\n📍 '+x.l)}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});q.oninput=render;render();</script></body></html>
