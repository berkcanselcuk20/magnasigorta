<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Portföyüm | Yeni İlan</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#111827}.wrap{max-width:760px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{border:0;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 13px}.title h1{margin:0;font-size:25px}.muted{color:#6b7280;font-size:13px}.section{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-bottom:16px}.section h2{font-size:17px;margin:0 0 14px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.upload{min-height:130px;border:2px dashed #cbd5e1;border-radius:14px;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-align:center}.upload strong{font-size:28px}.previews{display:contents}.preview{position:relative;height:130px;border-radius:14px;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover}.remove{position:absolute;right:6px;top:6px;width:28px;height:28px;border:0;border-radius:50%;background:#111827dd;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:800}input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font:inherit}textarea{min-height:110px;resize:vertical}.save{width:100%;padding:15px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:900;font-size:16px}.note{background:#eff6ff;border-radius:10px;padding:11px;font-size:12px;color:#1e40af;margin-top:10px}@media(max-width:520px){.grid{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,1fr)}}#file{display:none}</style></head><body><main class="wrap"><header class="top"><button class="back" onclick="history.back()">← Geri</button><div class="title"><h1>Yeni Portföy Ekle</h1><div class="muted">Yeni ilan bilgilerini ve fotoğrafları gir</div></div></header><form id="form"><section class="section"><h2>📸 Portföy Fotoğrafları</h2><div class="photos"><label class="upload" for="file"><strong>＋</strong><span>Fotoğraf ekle</span><small class="muted">Telefondan galeri açılır</small></label><div id="previews" class="previews"></div></div><input id="file" type="file" accept="image/*" multiple><div class="note">Birden fazla fotoğraf seçebilirsin. İlk fotoğraf ilan kapak fotoğrafı olarak kullanılacak.</div></section><section class="section"><h2>🏠 İlan Bilgileri</h2><div class="grid"><div class="field full"><label>İlan Başlığı</label><input id="name" required placeholder="Örn. Yenişehir Modern 3+1"></div><div class="field"><label>İlan Türü</label><select id="type"><option>Daire</option><option>Villa</option><option>Arsa</option><option>İşyeri</option></select></div><div class="field"><label>Durum</label><select id="status"><option>Satılık</option><option>Kiralık</option></select></div><div class="field"><label>Fiyat</label><input id="price" required inputmode="decimal" placeholder="4.250.000 TL"></div><div class="field"><label>m²</label><input id="area" inputmode="numeric" placeholder="165"></div><div class="field"><label>Oda Sayısı</label><select id="rooms"><option>1+0</option><option>1+1</option><option>2+1</option><option selected>3+1</option><option>4+1</option><option>5+1</option><option>6+1</option><option>—</option></select></div><div class="field"><label>Kat</label><input id="floor" placeholder="5. Kat"></div><div class="field"><label>Bina Yaşı</label><input id="age" inputmode="numeric" placeholder="0"></div><div class="field"><label>Isıtma</label><select id="heat"><option>Doğalgaz</option><option>Merkezi</option><option>Yerden Isıtma</option><option>Klima</option><option>Diğer</option></select></div><div class="field full"><label>Konum</label><input id="location" placeholder="Denizli / Yenişehir"></div><div class="field full"><label>Açıklama</label><textarea id="desc" placeholder="İlanın özelliklerini, ulaşım bilgilerini ve diğer detayları yaz..."></textarea></div></div></section><section class="section"><h2>📞 İletişim</h2><div class="field"><label>Telefon</label><input id="phone" inputmode="tel" placeholder="05XX XXX XX XX"></div></section><button class="save" type="submit">💾 PORTFÖYÜ KAYDET</button></form></main><script>const file=document.getElementById('file'),previews=document.getElementById('previews');let photos=[];file.onchange=e=>{[...e.target.files].forEach(f=>{const r=new FileReader();r.onload=()=>{photos.push(r.result);renderPhotos()};r.readAsDataURL(f)})};function renderPhotos(){previews.innerHTML=photos.map((src,i)=>`<div class="preview"><img src="${src}"><button class="remove" type="button" onclick="photos.splice(${i},1);renderPhotos()">×</button></div>`).join('')}document.getElementById('form').onsubmit=e=>{e.preventDefault();const item={name:name.value,type:type.value,status:status.value,price:price.value,area:area.value,rooms:rooms.value,floor:floor.value,age:age.value,heat:heat.value,location:location.value,desc:desc.value,phone:phone.value,photos};localStorage.setItem('demoProperty',JSON.stringify(item));alert('Portföy demo olarak kaydedildi. Fotoğraflar ve bilgiler tarayıcıda saklandı.');};</script></body></html>
